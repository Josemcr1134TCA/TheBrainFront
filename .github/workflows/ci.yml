name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Design system al día (tokens, documento de referencia, tema)
        run: npm run ds:check
      - name: Reglas de arquitectura del arnés (fronteras entre módulos, design system, sin backend ni Hub)
        run: npm run arch:check
      - run: npm run build
      - run: npm test -- --watch=false
